# Shared rl_games boilerplate lives in configs/defaults/base.yaml (merged at load). See ADR-0006.
env:
  train_pct: 0.5            # fraction of morphologies for training (rest = held-out test set)
  test_set: false

params:
  seed: 42

  network:
    transformer:
      d_model: 160
      n_heads: 16
      n_layers: 1
      ffn: 640

  config:
    num_actors: 4096
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    learning_rate: 6e-4
    kl_threshold: 0.0235
    max_epochs: 1500
    save_best_after: 200
    save_frequency: 50
    grad_norm: 1.6
    entropy_coef: 0.0015
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 32768  # auto-snapped to divide batch if needed (see _adjust_minibatch)
    mini_epochs: 4
    critic_coef: 3.25
    bounds_loss_coef: 0.0
