# Codesign: combined PPO control + sequential per-token morphology generator (ADR-0012).
# Control gains the V1.0 body-quality head (value_size=2); the generator's reward is R_i=V1.0(s0).
# Mirrors ppo_ant_full.yaml's tuned control HPs so the generator is the only new variable.
# Shared rl_games boilerplate lives in configs/defaults/base.yaml (merged at load). See ADR-0006.
env:
  sample_morphs: true       # unlocks resample(); AntCodesignEnv overrides _draw_morphs (rng unused)
  base_legs: [1, 4, 6]      # initial build + warmup center (must match generator.base_legs)
  value_size: 2             # control V1.0 head + trailing normalized-progress obs dim

params:
  seed: 42

  algo:
    name: codesign_continuous   # selects CodesignAgent (overrides base.yaml's a2c_continuous)

  network:
    transformer:
      d_model: 160
      n_heads: 8
      n_layers: 1
      ffn: 640

  config:
    use_diagnostics: False   # stock rms_value diag logs a (2,) scalar with value_size==2 (v1/* replace it)
    num_actors: 4096
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    gamma_v1: 1.0            # V1.0 head discount (full-episode body quality)
    v1_coef: 1.625           # V1.0 critic-loss weight (~0.5 * critic_coef)
    learning_rate: 1.0e-3
    kl_threshold: 0.0083
    max_epochs: 3000          # ~24+ generator windows at resample_interval=1 (ADR-0010)
    save_best_after: 200
    save_frequency: 50
    grad_norm: 1.45
    entropy_coef: 0.0055
    e_clip: 0.15
    resample_interval: 1     # one generator decision + update per ~62-epoch window (full rebuild)
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 3.25
    bounds_loss_coef: 0.0005

    generator:               # sequential per-token PPG (SeqGenerator, ADR-0012)
      base_legs: [1, 4, 6]
      desirable_flip_prob: 0.10
      d_model: 128
      n_heads: 8
      n_layers: 1            # 1-layer keeps KV caching exact (deferred)
      ffn: 512
      lr: 1.0e-3
      clip: 0.2
      entropy_coef: 0.01
      critic_coef: 0.5
      epochs: 4
      minibatches: 4
      n_pretrain: 8          # warmup windows (teacher-forced BC + value distill, ramp gen-frac 0->1)
