# Single-network codesign ON THE ANT. Everything about the algorithm lives in the parent; this leaf
# holds only what is a fact about the task. Slots are 0-BASED -- the pre-migration
# `base_legs: [1, 4, 6]` is the same three limbs as `slots: [0, 3, 5]` below.
extends: ppo_codesign_single.yaml

env:
  task: ant
  base_morphology:          # the seed body: window 0 runs on it, the warmup teacher is relative to it
    slots: [0, 3, 5]
    effectors: [swing, knee]
    cap: bare

params:
  config:
    generator:
      return_target: train # train | post
      response_probe:
        enabled: false       # detached capture; offline fit via scripts/probe_static_response.py
        max_bodies: 256
        samples: 8
      spatial_credit:
        enabled: false
        loss_coef: 0.1
        tree_lambda: 0.5
        pair_supervision: false
        pair_loss_coef: 0.1
        pair_batch_size: 512
        use_for_genact: false
        genact_credit_mode: none
        genact_beta: 0.5
