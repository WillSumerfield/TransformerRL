# Single-network codesign: control (ContAct + ContCrit/V0.98) and the morphology generator
# (GenAct + GenCrit/V1.0) share ONE LegTransformer trunk (codesign_tokens=true) under one
# optimizer. value_size=1 (V1.0 is the gencrit_head, not a value column). Per step: plain combined
# PPO on control. At each resample: fit GenCrit (rollout states + designed prefixes -> R), GenAct
# PPO, and clone control (beta*KL + lam*MSE). See temp/codesign_single_network_plan.md, CONTEXT.md.
env:
  sample_morphs: true       # unlocks resample(); AntCodesignEnv overrides _draw_morphs (rng unused)
  base_legs: [1, 4, 6]      # initial build + warmup center (must match generator.base_legs)

params:
  seed: 42

  algo:
    name: codesign_continuous   # selects CodesignAgent

  network:
    transformer:
      d_model: 160
      n_heads: 8
      n_layers: 1
      ffn: 640
      codesign_tokens: true     # fixed 25-token scheme + gen/critic heads on the shared trunk

  config:
    num_actors: 4096
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    learning_rate: 1.0e-3
    kl_threshold: 0.0083
    max_epochs: 3000
    save_best_after: 200
    save_frequency: 50
    grad_norm: 1.45
    entropy_coef: 0.0055
    e_clip: 0.15
    resample_interval: 1     # one generator window per ~62-epoch rebuild window
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 3.25
    bounds_loss_coef: 0.0005

    generator:               # generator heads share the trunk/optimizer (no separate net/lr)
      base_legs: [1, 4, 6]
      desirable_flip_prob: 0.10
      n_pretrain: 8          # warmup windows (BC toward built body + value fit, ramp gen-frac 0->1)
      epochs: 4
      minibatches: 4
      clip: 0.2              # GenAct PPO-clip
      entropy_coef: 0.01
      gencrit_coef: 0.5      # weight on the V1.0 fit (designed prefixes + rollout states -> R)
      beta: 1.0             # control-actor KL clone coefficient
      lam: 1.0             # control-critic MSE clone coefficient
