# FD+FK arm: adds the Phase-2b Forward Dynamics + Forward Kinematics aux heads, FUSED into the PPO
# loss (0 extra forward passes). Everything else is INHERITED, so this arm differs from the baseline
# ONLY by config.fd / config.fk.
extends: ppo_ant_codesign_single.yaml

params:
  config:
    fd:                      # per-module next-step prediction
      enabled: true
      coef: 1.0              # weight on the FD MSE (normalized target space)

    fk:                      # branch-causal; own torso-frame pose (pos + rot6D + vel, 15)
      enabled: true
      coef: 1.0              # weight on the FK MSE (per-depth normalized target space)
