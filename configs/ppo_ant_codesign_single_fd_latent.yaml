# FD-LATENT arm: identical to the FD+FK arm except transformer.fd_variant=latent -- the FD head
# predicts the content-only embed of next_obs (cosine loss) instead of the raw 21-D target. Sole
# diff from fd.yaml, so it isolates raw-vs-latent target space (grill 2026-07-12).
# FK stays RAW (latent FK is degenerate).
extends: ppo_ant_codesign_single_fd.yaml

params:
  network:
    transformer:
      fd_variant: latent      # FD head predicts content-only next-obs embed (cosine), not raw 21-D

  config:
    fd:
      coef: 1.0               # cosine loss in [0,4]; may retune vs raw-FD MSE scale
