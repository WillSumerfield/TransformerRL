# JEPA arm: single-network codesign + JEPA aux (same-step masked-latent prediction on the shared
# control trunk). Everything else -- net, generator, PPO knobs -- is INHERITED, so this arm differs
# from the baseline ONLY by config.jepa. jepa.enabled=false reproduces the baseline exactly.
# See temp/Phase2_JEPA_plan.md.
extends: ppo_ant_codesign_single.yaml

params:
  config:
    jepa:                    # Phase 2 aux self-supervision (control trunk)
      enabled: true
      coef: 1.0              # weight on the JEPA loss in the control-phase separate step
      mask_prob: 0.25        # Bernoulli per maskable token (CLS + active modules)
      chunk_states: 8192     # grad-accumulate the masked pass in chunks to cap peak VRAM (0=whole mb)
      anchor_coef: 1.0       # repr-anchor in _resample_update (Step 4)
      anchor_snapshot_states: 16384   # random subset of rollout states for the anchor snapshot (Step 4)
