# FD/FK tuning base (proxy for scripts/tune.py, configs/tune_config.yaml). Identical to
# ppo_ant_codesign_single.yaml EXCEPT: max_epochs trimmed to 2000 (the tuning budget) and
# checkpointing pushed past it (tuner reads TB summaries only, not .pth). The study overrides the
# five FD/FK knobs per trial (fd.enabled, fd.coef, fd_variant, fk.enabled, fk.coef); the values
# here are the trial-0 / anchor defaults. The real-run config (3000 epochs) stays untouched.
#
# `seed` here is only the anchor default: the tuner overwrites it per trial (see ADR-0018). It sets
# it through THIS key and never through the trainer's --seed flag, which would additionally force
# deterministic kernels and measure a machine no real run uses.
params:
  seed: 42

  algo:
    name: codesign_continuous   # selects CodesignAgent

  network:
    transformer:
      d_model: 160
      n_heads: 8
      n_layers: 1
      ffn: 640
      codesign_tokens: true     # uniform module-token scheme + gen/critic heads on the shared trunk
      fd_variant: latent        # FD head predicts content-only next-obs embed (cosine); 'raw' = 21-D obs target; SWEPT
      use_rope: true            # 3a WINNER (rew 2366 vs 1998 base): depth-only RoPE on module Q/K
      reg_mode: none            # 3b: none|dropout|attention_drop (mutually exclusive)
      dropout: 0.1              # 3b: prob used by whichever reg_mode is active (ignored if none)

  config:
    num_actors: 4096
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    weight_decay: 0.01        # 3b WINNER: AdamW (CodesignAgent), 2 param groups; 0 == plain Adam
    lr_warmup: true           # 3c WINNER (short ramp): linear 0->peak over warmup_epochs, then AKL.
    warmup_epochs: 64         # 3c: ramp DURATION in epochs. 64 (~1 window) beat control.
    learning_rate: 1.0e-3
    kl_threshold: 0.0083
    max_epochs: 2000          # tuning budget (real run = 3000); ~32 resample windows
    save_best_after: 100000   # no "best" checkpoints: the tuner scores from TB, never from a .pth
    # Periodic saves exist ONLY so a crashed trial can resume instead of being retried from scratch.
    # The gym-rebuild race is ~0.6% per rebuild and a trial spans ~32 rebuilds, so ~18% of trials hit
    # it; without a checkpoint each one costs a full re-run (or lands a false _NEGINF in a study
    # already at its noise floor). 100 epochs bounds the loss at ~5% of a trial. The tuner keeps only
    # the newest couple and deletes them all when the trial ends, so the ~19MB/save never accumulates.
    save_frequency: 100
    grad_norm: 1.45
    entropy_coef: 0.0055
    e_clip: 0.15
    resample_interval: 1     # one generator window per ~62-epoch rebuild window
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 4
    critic_coef: 3.25
    bounds_loss_coef: 0.0005

    generator:               # generator heads share the trunk/optimizer (no separate net/lr)
      teacher: parts         # parts-copy warmup teacher (the generator's post-warmup BC prior)
      copy_prob: 0.6         # p: slot keeps its OWN seed limb template (else copies another slot's)
      len_keep_prob: 0.6     # q: P(per-limb length offset == 0); sets the Gaussian sigma
      prob_invalid: 0.1      # keep an UNSTABLE body w.p. this (GenCrit needs negatives)
      type_flip_prob: 0.10   # Phase-5 per-token TYPE flip: seeds the BC prior with real type diversity
      n_pretrain: 8          # warmup windows (BC toward the teacher draw + value fit; ramp gen-frac 0->1)
      epochs: 16             # BC epochs/window; each REDRAWS the teacher, so 16 = 4x fresh data
      minibatches: 4
      clip: 0.2              # GenAct PPO-clip
      entropy_coef: 0.05      # RL-only (0 in warmup: BC is max-likelihood, teacher is the diversity source)
      gencrit_coef: 0.5      # weight on the V1.0 fit (designed prefixes + rollout states -> R)
      beta: 1.0             # control-actor KL clone coefficient
      lam: 1.0             # control-critic MSE clone coefficient

    fd:                      # Phase 2b Forward Dynamics aux, FUSED into the PPO loss (0 extra passes)
      enabled: true          # false == phase-1 baseline (get_aux_loss -> None); SWEPT by the study
      coef: 1.0              # cosine loss in [0,4] (latent variant); may retune vs raw-FD MSE scale; SWEPT

    fk:                      # Phase 2b Forward Kinematics aux, FUSED (0 extra passes); own torso-frame
      enabled: true          # pose (pos+rot6D+vel, 15). Stays RAW (latent FK is degenerate); SWEPT
      coef: 1.0              # weight on the FK MSE (per-depth normalized target space); SWEPT

# See ppo_ant_codesign_single.yaml for the `env:` block's contract. Slots are 0-based.
env:
  module_library: simple
  base_morphology:
    slots: [0, 3, 5]
    effectors: [swing, knee]
    cap: bare
