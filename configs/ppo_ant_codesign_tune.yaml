# FD/FK tuning proxy for the ant codesign run (scripts/tune.py, configs/tune_config.yaml).
#
# It EXTENDS the real run config rather than copying it, so the two cannot drift: the three keys
# below are the only intended differences, and they are exactly the differences. The cost is that
# editing the parent changes a study already in flight -- acceptable because tune.py stamps a
# resolved trial_N.yaml per trial, so completed trials stay recorded with the values they ran.
#
# The study overrides the five FD/FK knobs per trial (fd.enabled, fd.coef, fd_variant, fk.enabled,
# fk.coef); the parent's values are the trial-0 / anchor defaults. `seed` is likewise only an anchor:
# the tuner overwrites it per trial through params.seed and never through the trainer's --seed flag,
# which would additionally force deterministic kernels and measure a machine no real run uses
# (ADR-0018).
extends: ppo_ant_codesign_single.yaml

params:
  config:
    max_epochs: 2000          # tuning budget (real run = 3000); ~32 resample windows
    save_best_after: 100000   # no "best" checkpoints: the tuner scores from TB, never from a .pth
    # Periodic saves exist ONLY so a crashed trial can resume instead of being retried from scratch.
    # The gym-rebuild race is ~0.6% per rebuild and a trial spans ~32 rebuilds, so ~18% of trials hit
    # it; without a checkpoint each one costs a full re-run (or lands a false _NEGINF in a study
    # already at its noise floor). 100 epochs bounds the loss at ~5% of a trial. The tuner keeps only
    # the newest couple and deletes them all when the trial ends, so the ~19MB/save never accumulates.
    save_frequency: 100
