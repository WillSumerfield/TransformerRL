# Shared rl_games boilerplate lives in configs/defaults/base.yaml (merged at load). See ADR-0006.
env:
  sample_morphs: true       # sample num_envs variable-length bodies (one per env), seeded

params:
  seed: 42                   # seeds morphology sampling for reproducible runs

  network:
    transformer:
      d_model: 208
      n_heads: 8
      n_layers: 1
      ffn: 832

  config:
    num_actors: 4096
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    learning_rate: 7e-4
    kl_threshold: 0.015
    max_epochs: 1000
    save_best_after: 200
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.001
    e_clip: 0.2
    resample_interval: 2    # episodes between full morphology resamples (gym rebuild); 0 = off
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 2
    bounds_loss_coef: 0.0
