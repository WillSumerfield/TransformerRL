# Shared rl_games boilerplate lives in configs/defaults/base.yaml (merged at load). See ADR-0006.
env:
  sample_morphs: true       # sample num_envs variable-length bodies (one per env), seeded

params:
  seed: 42                   # seeds morphology sampling for reproducible runs

  network:
    transformer:
      d_model: 160
      n_heads: 8
      n_layers: 1
      ffn: 640

  config:
    num_actors: 4096
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    learning_rate: 1.0e-3
    kl_threshold: 0.0083
    max_epochs: 1500
    save_best_after: 200
    save_frequency: 50
    grad_norm: 1.45
    entropy_coef: 0.0055
    e_clip: 0.15
    resample_interval: 5    # episodes between full morphology resamples (gym rebuild); 0 = off
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 3.25
    bounds_loss_coef: 0.0005
