# Shared rl_games boilerplate lives in configs/defaults/base.yaml (merged at load). See ADR-0006.
params:
  seed:

  network:
    mlp:
      units: [512, 256, 128]
      activation: elu
      initializer:
        name: default

  config:
    num_actors: 8192
    reward_shaper:
      scale_value: 0.01
    gamma: 0.98
    tau: 0.95
    learning_rate: 7e-4
    kl_threshold: 0.015
    max_epochs: 500
    save_best_after: 200
    save_frequency: 50
    grad_norm: 1.0
    entropy_coef: 0.001
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 4
    critic_coef: 2
    bounds_loss_coef: 0.0

# The Task, named by config and resolved through the package task registry. No entry point
# names a task; this key is what makes the run an ant run.
env:
  task: ant
