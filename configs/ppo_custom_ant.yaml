env:
  id: CustomAnt-v5
  num_envs: 16
  curriculum_onset_start: 0.0
  curriculum_onset_end: 1.0

trainer:
  timesteps: 2000000
  headless: true

ppo:
  rollouts: 512
  learning_epochs: 10
  mini_batches: 32
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.0e-4
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0
  kl_threshold: 0.0
  time_limit_bootstrap: true

experiment:
  directory: runs
  name: custom_ant_transformer_ppo