# SCREEN stage: rank which of 16 hyperparameters matter for ppo_codesign_single on the ant.
# Nothing in that config has been jointly tuned -- the 3a/3b/3c winners baked into it came from
# greedy narrow sweeps that could not see interactions -- so this is a genuine first pass.
#
#   0. build:      one worst-corner trial (d_model=256, horizon_length=32) on a real 24GB slice
#   1. calibrate:  python scripts/tune.py configs/tune_codesign_ant_screen.yaml --calibrate 8
#                  -> read the noise floor AND the anchor's build/n_modes, then set study.gate.floor
#   2. run:        python scripts/tune.py configs/tune_codesign_ant_screen.yaml --headless
#   3. report:     python scripts/tune.py configs/tune_codesign_ant_screen.yaml --report
#
# Then author the FOCUS config: base_config = this study's best_params.yaml (a fully resolved config,
# so the screen centre is baked in for all 16), FRAMES doubled to 196608000 (3000-epoch equivalent),
# and params cut to those the report shows are BOTH important (fANOVA) and determined (top-k spread).
# The focus's own --calibrate wave is therefore the screen winner's confirmation, which is why no
# --confirm is run here.
#
# NOTE: `base_config` is the ordinary task leaf, not a tune-only config. The deleted
# ppo_ant_codesign_tune.yaml only ever supplied max_epochs, and that is derived per trial now.
study:
  name: codesign_ant_screen
  n_trials: 248                 # 8 calibration + 240 search. A wave runs as ordinary trials in this
                                # study and CONSUMES budget, so n_trials carries it (ADR-0018).
  output_dir: logs/tune/codesign_ant_screen
  script: scripts/train_codesign_single.py
  base_config: configs/ppo_ant_codesign_single.yaml

  # Generous by design: _score_job SCORES a timed-out run on its partial series rather than
  # discarding it, so a tight timeout silently biases against expensive configs. mini_epochs 2->8
  # swings gradient cost 4x and the gradient update is 86% of the epoch (ADR-0017), so this must
  # clear the slowest legitimate trial, not the average one. ~1.5h nominal, 5h cap.
  trial_timeout_seconds: 18000

  # ── objective (ADR-0020) ──
  #   score = mean(quality/R_mean, last 5 windows) x min(1, mean(build/n_modes, whole series)/floor)
  # WINDOW-indexed, not epoch-indexed: one point per resample window is phase-aligned by
  # construction, which is the only reason horizon_length is a legal sweep parameter below. An
  # epoch-indexed tail (rewards/iter) lands at an arbitrary phase within a window once timing moves,
  # and score_mode: final_frac does not rescue it -- that path subtracts n_pretrain (a WINDOW count)
  # from n (an EPOCH count), a cap only meaningful for a window-indexed series.
  metric_key: "quality/R_mean"
  score_mode: recovered
  score_window: 5               # windows, not epochs
  gate:
    key: "build/n_modes"        # the diversity HEADLINE: Hill(q=1) over single-linkage d_struct
                                # clusters at tau=1, on the SUBTYPE-COLLAPSED skeleton. 1.0 == one
                                # design == full collapse, by construction. NOT build/n_distinct:
                                # that counts typed designs, and the free_entropy finding is that
                                # the skeleton commits while subtypes stay free, so it never left
                                # 286-4096/4096 across a whole prior study. It cannot detect this.
    floor: null                 # null == gate INERT. Set after the calibration wave (by eye, from
                                # the anchor's n_modes band). The anchor passes any sane floor, so
                                # calibration and search stay comparable either way.
    window: 0                   # 0 == whole series. n_modes is logged RL-only, so that is exactly
                                # "all RL windows" -- the gate asks "did it ever search", not "is it
                                # still searching": late commitment is success, not collapse.

  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries
  sampler_seed: 42              # seeds BOTH the TPE sampler and the per-trial seed RNG (ADR-0018).
                                # Trial seeds go through params.seed, never the --seed flag.

  # ── parallel scheduling (ADR-0017) ──
  slots: auto                   # 8 MIG slices on the tuning box; --slots 1 --allow-busy locally
  launch_stagger_seconds: 30
  max_attempts: 3               # rebuild crash resumes from checkpoint; OOM never relaunches
  keep_checkpoints: 2

  # ── reporting (ADR-0018) ──
  top_k: null                   # -> max(3, 15% of completed) == ~36 at 240 completed
  noise_metrics:                # window 24 >= the total window count, i.e. the WHOLE series -- so
    - {key: "quality/R_mean", window: 5}    # the reported n_modes CV is the CV of the quantity the
    - {key: "build/n_modes",  window: 24}   # gate actually reads, not of some other tail

pruner:
  enabled: false                # ADR-0018: stays off until a calibration wave shows mid-run rank
                                # predicts final rank. Under SNR<1 it kills unlucky SEEDS, and
                                # pruned trials contribute no final score to the top-k centre.

# Frames, not epochs, are held constant across the horizon_length sweep: max_epochs is derived so
# that num_actors * horizon_length * max_epochs == 98304000 (== the 1500-epoch h=16 reference). That
# holds the WINDOW count at 24 for every trial too, which is what keeps the 5-window tail comparable.
# minibatch_size stays fixed at 16384 (not derived), so total gradient steps == frames/minibatch *
# mini_epochs is also constant and the h sweep isolates GAE rollout length.
derived_params:
  - path: params.config.max_epochs
    expr: "98304000 // (4096 * horizon_length)"
  - path: params.network.transformer.ffn
    expr: "4 * d_model"

# NOTE on short names: derived_params/feasibility_expr see swept params by their LAST path segment,
# so `entropy_coef` there would be ambiguous (control and generator both have one; the generator's
# wins, being later). Neither expression above uses it. The same collision makes two columns in the
# TUI and results tables read `entropy_coef` -- the first is control, the second the generator's.
#
# No feasibility_expr is needed: windows == 24 always and n_pretrain caps at 16, so every trial has
# at least 8 RL windows against a 5-window tail.
params:
  # ── control PPO ──
  - {path: params.config.learning_rate, type: float, low: 2.0e-4, high: 3.0e-3, log: true}
    # Near-inert and swept deliberately anyway: _WarmupThenAdaptiveScheduler uses it as the ramp PEAK
    # for warmup_epochs (64) epochs, then AdaptiveScheduler(kl_threshold) -- a x1.5/÷1.5 walk that
    # erases a 15x range in ~7 steps. kl_threshold below is the real controller.
  - {path: params.config.kl_threshold, type: float, low: 0.002, high: 0.03, log: true}
  - {path: params.config.entropy_coef, type: float, low: 1.0e-4, high: 0.03, log: true}
  - {path: params.config.e_clip, type: float, low: 0.1, high: 0.3}
  - {path: params.config.critic_coef, type: float, low: 0.5, high: 8.0, log: true}
  - {path: params.config.grad_norm, type: float, low: 0.3, high: 5.0, log: true}
  - {path: params.config.gamma, type: float, low: 0.95, high: 0.995}
  - {path: params.config.weight_decay, type: float, low: 1.0e-5, high: 0.1, log: true}
    # low is 1e-5, not 0: a log range cannot express 0, and 1e-5 is operationally plain Adam.

  # ── generator ──
  - {path: params.config.generator.entropy_coef, type: float, low: 0.005, high: 1.0, log: true}
    # Tops at 1.0 to span 0.6, the one value ever chosen deliberately (938ddc5: "entropy is the lever
    # against generator collapse"). The current 0.05 is NOT a tuning result -- it rode along in the
    # phase-5 typed-vocabulary commit (923ba4b), which made the decoder factored (entropy = cat +
    # sub), so 0.6 and 0.05 are in different units and 0.05 is of unknown calibration.
  - {path: params.config.generator.gencrit_coef, type: float, low: 0.05, high: 5.0, log: true}
  - {path: params.config.generator.beta, type: float, low: 0.1, high: 10.0, log: true}
  - {path: params.config.generator.lam, type: float, low: 0.1, high: 10.0, log: true}
  - {path: params.config.generator.n_pretrain, type: int, low: 2, high: 16}
    # BC warmup length in WINDOWS. 8 of 24 today -- a third of the run -- and it installs the
    # generator's prior, which makes it the highest-leverage untuned knob here.

  # ── timing / batch ──
  - {path: params.config.horizon_length, type: categorical, choices: [8, 16, 32]}
  - {path: params.config.mini_epochs, type: int, low: 2, high: 8}

  # ── architecture ──
  - {path: params.network.transformer.d_model, type: int, low: 128, high: 256, step: 32}
    # 128/160/192/224/256 -- all divisible by n_heads (8). ffn follows at 4x (derived_params).
