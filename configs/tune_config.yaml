# FD/FK aux-head tuning (Optuna TPE via scripts/tune.py). Tunes the Phase-2b Forward Dynamics and
# Forward Kinematics auxiliary heads on the single-network codesign model: each on/off, its loss
# coef, and the FD target variant. Objective = task reward (control), NOT quality/R_mean: FD/FK are
# control-side auxiliaries, so the most direct "did the aux help" signal is the recovered reward.
#
#   calibrate: python scripts/tune.py --calibrate 8   # FIRST: anchor at 8 seeds -> noise floor
#   run:       python scripts/tune.py                 # this file is the default
#   resume:    same command (study.db);  --reset to start over
#   confirm:   python scripts/tune.py --confirm 8     # LAST: the exported winner at 8 fresh seeds
#   report:    python scripts/tune.py --report        # re-print results, no GPU needed
# Add --headless on the tuning box (the live TUI needs a TTY). A calibration/confirmation wave runs
# in THIS study and counts against n_trials, so raise n_trials by the wave size (ADR-0018).
#
# Flat 5-param space with EXPLICIT on/off booleans (fd.enabled, fk.enabled). Consequence: only ~25%
# of sampled trials have both heads on, so the 5 enqueued anchors below pin the clean 2x2 on/off
# ablation (+ both-on x {latent,raw}) at default coef=1.0 regardless of how TPE spends the rest.
# fd.coef is log-uniform so one range covers both the latent (cosine, ~[0,4]) and raw (MSE) scales.
#
# Pruning OFF: every trial runs the full 2000 epochs. n_pretrain is fixed (8), so the RL phase starts
# at the same epoch every trial; the objective is the recovered level = mean reward over the last
# `score_window` epochs (score_mode=recovered), not a lucky max spike.
study:
  name: codesign_fdfk_tune
  n_trials: 20                  # incl. the 5 enqueued anchors (-> ~15 TPE trials); ~30h at ~1.5h/trial
  output_dir: logs/tune/codesign_fdfk_tune
  script: scripts/train_codesign_single.py
  base_config: configs/ppo_ant_codesign_tune.yaml
  trial_timeout_seconds: 9000   # wall-clock safety net (~2.5h); max_epochs (2000) is the real limiter.
                                # Must exceed full-run time: the objective scores the LAST epochs.
  metric_key: "rewards/iter"    # vlearn's per-epoch mean episode reward (== rewards/step|time, diff x-axis)
  score_mode: recovered         # recovered level = mean of the last `score_window` logged epochs
  score_window: 100
  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries
  sampler_seed: 42              # seeds BOTH the TPE sampler and the per-trial seed RNG (ADR-0018),
                                # so the study is reproducible as a whole while no two trials share
                                # a seed. Trial seeds go through params.seed, never the --seed flag.

  # ── parallel scheduling (ADR-0017) ──  one trial = one process = one pinned device.
  slots: auto                   # 'auto' (every idle device) | N (first N idle) | explicit device list.
                                # slots=1 is exactly the old serial tuner. Override with --slots.
  launch_stagger_seconds: 30    # keep initial scene builds from contending for pinned host memory
  max_attempts: 3               # total launches per trial; a rebuild crash resumes from checkpoint,
                                # an OOM never relaunches (it is a property of the hyperparameters)
  keep_checkpoints: 2           # per trial while it runs (all deleted when it ends); 2 not 1 so a
                                # crash mid-write cannot leave the only checkpoint truncated

  # ── reporting (ADR-0018) ──
  top_k: null                   # null -> max(3, 15% of completed); winner = centre of this cluster
  noise_metrics:                # each needs its OWN tail window: rewards/iter is per-epoch (~2000
    - {key: "rewards/iter",    window: 100}   # points) while R_mean is per resample window (~31),
    - {key: "quality/R_mean",  window: 5}     # where a 100-point tail would average the whole run
  # Corner anchors (guaranteed sampled first): both-off baseline, FD-only, FK-only, both-on(latent),
  # both-on(raw). Each is fully specified so Optuna does not random-fill the irrelevant knobs.
  enqueue_trials:
    - {params.config.fd.enabled: false, params.config.fk.enabled: false, params.network.transformer.fd_variant: latent, params.config.fd.coef: 1.0, params.config.fk.coef: 1.0}
    - {params.config.fd.enabled: true,  params.config.fk.enabled: false, params.network.transformer.fd_variant: latent, params.config.fd.coef: 1.0, params.config.fk.coef: 1.0}
    - {params.config.fd.enabled: false, params.config.fk.enabled: true,  params.network.transformer.fd_variant: latent, params.config.fd.coef: 1.0, params.config.fk.coef: 1.0}
    - {params.config.fd.enabled: true,  params.config.fk.enabled: true,  params.network.transformer.fd_variant: latent, params.config.fd.coef: 1.0, params.config.fk.coef: 1.0}
    - {params.config.fd.enabled: true,  params.config.fk.enabled: true,  params.network.transformer.fd_variant: raw,    params.config.fd.coef: 1.0, params.config.fk.coef: 1.0}

pruner:
  enabled: false

params:
  # ── on/off ──
  - path: params.config.fd.enabled
    type: categorical
    choices: [true, false]

  - path: params.config.fk.enabled
    type: categorical
    choices: [true, false]

  # ── FD target variant (only meaningful when fd.enabled) ──
  - path: params.network.transformer.fd_variant
    type: categorical
    choices: [latent, raw]

  # ── aux loss coefs (log: one range spans latent-cosine and raw-MSE scales) ──
  - path: params.config.fd.coef
    type: float
    low: 0.05
    high: 5.0
    log: true

  - path: params.config.fk.coef
    type: float
    low: 0.05
    high: 5.0
    log: true
