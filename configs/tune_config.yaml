# Codesign hyperparameter sweep (Optuna TPE via scripts/tune.py). Finetunes the single-network
# codesign model: tunes the never-swept generator/clone knobs plus the few control-PPO knobs most
# affected by the shared trunk. Objective = quality/R_mean (the body-quality target), reduced as the
# MEAN OF THE LAST 5 RESAMPLE WINDOWS (converged RL state, not a lucky spike).
#
#   run:    python scripts/tune.py            # this file is the default
#   resume: same command (study.db);  --reset to start over
#
# Cadence: resample_interval=1 -> ~62 epochs/window. The 1200-epoch proxy (base config) is ~19
# windows; n_pretrain (<=10) eats the first windows, leaving >=9 RL windows for the objective.
#
# Pruning OFF (ADR-0009): n_pretrain is tuned, so the RL phase starts at a different epoch per trial
# and same-epoch median comparison would be unfair. With pruning off the tuner would default to a
# max-over-training objective; quality/R_mean is sparse+noisy (one point/window) so we instead force
# a final-level objective via study.score_mode=final + study.score_window=5.
study:
  name: codesign_ant_tune
  n_trials: 200                 # generous ceiling; cancel early when satisfied (resumes from study.db)
  output_dir: logs/tune/codesign_ant_tune
  script: scripts/train_ant_codesign_single.py
  base_config: configs/ppo_ant_codesign_tune.yaml
  trial_timeout_seconds: 3600   # wall-clock safety net; max_epochs (1200) is the real limiter.
                                # Must exceed full-proxy time: the objective scores the LAST windows,
                                # so a premature timeout would cut off exactly what we score on.
  metric_key: "quality/R_mean"
  score_mode: final             # mean of the last `score_window` logged points (not max-over-training)
  score_window: 5               # last 5 resample windows (~the converged RL state)
  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries
  sampler_seed: 42              # reproducible TPE (single-seed tuning)

pruner:
  enabled: false

params:
  # ── control PPO (shared-trunk-sensitive subset) ──
  - path: params.config.learning_rate
    type: float
    low: 2.0e-4
    high: 1.5e-3
    log: true

  - path: params.config.entropy_coef
    type: float
    low: 1.0e-3
    high: 3.0e-2
    log: true

  - path: params.config.critic_coef
    type: float
    low: 1.0
    high: 5.0

  - path: params.config.grad_norm
    type: float
    low: 0.5
    high: 2.0

  # ── generator + clone (codesign-specific, never tuned) ──
  # GenCrit/V1.0 fit weight: too low -> dead value head (no marginal signal); too high -> starves
  # GenAct/control on the shared step.
  - path: params.config.generator.gencrit_coef
    type: float
    low: 0.1
    high: 4.0
    log: true

  # Control-actor KL clone: too low -> control drifts at resample (saw-tooth); too high -> trunk
  # can't move for the generator.
  - path: params.config.generator.beta
    type: float
    low: 0.1
    high: 5.0
    log: true

  # Control-critic MSE clone (V0.98 preservation).
  - path: params.config.generator.lam
    type: float
    low: 0.1
    high: 5.0
    log: true

  # Generator on/stop exploration: too low -> premature mode collapse; too high -> never commits.
  - path: params.config.generator.entropy_coef
    type: float
    low: 1.0e-3
    high: 1.0e-1
    log: true

  - path: params.config.generator.clip
    type: float
    low: 0.1
    high: 0.3

  - path: params.config.generator.epochs
    type: categorical
    choices: [2, 4, 6, 8]

  # Warmup windows. Capped at 10 so >=9 RL windows survive the 1200-epoch proxy (the last-5-window
  # objective must land in the RL phase). Varying this is why pruning is off.
  - path: params.config.generator.n_pretrain
    type: categorical
    choices: [4, 6, 8, 10]
