study:
  name: ppo_ant_adaptive_tune
  n_trials: 120
  output_dir: logs/tune/ppo_ant_adaptive_tune
  script: scripts/train_ant_adaptive.py
  base_config: configs/ppo_ant_adaptive.yaml
  trial_timeout_seconds: 1200
  metric_key: "rewards/step"
  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries

params:
  # ── PPO ──
  - path: params.config.learning_rate
    type: float
    low: 2.0e-4
    high: 1.5e-3
    log: true

  - path: params.config.kl_threshold
    type: float
    low: 1.0e-3
    high: 3.0e-2
    log: true

  - path: params.config.entropy_coef
    type: float
    low: 1.0e-4
    high: 1.0e-2
    log: true

  - path: params.config.e_clip
    type: float
    low: 0.1
    high: 0.3

  - path: params.config.critic_coef
    type: float
    low: 1.0
    high: 4.0

  - path: params.config.grad_norm
    type: float
    low: 0.5
    high: 2.0

  # ── transformer ── (d_model choices all divisible by every n_heads)
  - path: params.network.transformer.d_model
    type: categorical
    choices: [160, 208, 256]

  - path: params.network.transformer.n_heads
    type: categorical
    choices: [4, 8, 16]

  - path: params.network.transformer.n_layers
    type: categorical
    choices: [1, 2]

derived_params:
  - path: params.network.transformer.ffn
    expr: "4 * d_model"
