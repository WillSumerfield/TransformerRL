study:
  name: ppo_ant_transformer_tune
  n_trials: 50
  output_dir: logs/tune/ppo_ant_transformer_tune
  script: scripts/train_ant_transformer.py
  base_config: configs/ppo_ant.yaml
  trial_timeout_seconds: 900
  metric_key: "rewards/step"
  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries

params:
  - path: params.config.horizon_length
    type: categorical
    choices: [8, 16, 32]

  - path: params.config.e_clip
    type: float
    low: 0.1
    high: 0.3

  - path: params.config.critic_coef
    type: float
    low: 1.0
    high: 4.0

  - path: params.config.grad_norm
    type: float
    low: 0.5
    high: 2.0

derived_params:
  - path: params.config.minibatch_size
    expr: "4096 * horizon_length // 4"
