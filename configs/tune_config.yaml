study:
  name: ppo_ant_full_tune
  n_trials: 250                 # generous ceiling; cancel early when satisfied (study resumes from study.db)
  output_dir: logs/tune/ppo_ant_full_tune
  script: scripts/train_ant_full.py
  base_config: configs/ppo_ant_full.yaml
  trial_timeout_seconds: 1800   # 30-min wall-clock safety net; max_epochs (1500) is the typical limiter.
                                # On timeout the trial is scored on partial progress, not discarded.
  metric_key: "rewards/step"
  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries

# Pruning OFF: this sweep tunes resample_interval, so resample dips fall at different epochs
# per trial — same-epoch median comparison (and the recovered-level window) would be unfair.
# Disabled -> objective falls back to max-over-training, no early kills. See ADR-0009.
pruner:
  enabled: false

params:
  # ── PPO ──
  - path: params.config.learning_rate
    type: float
    low: 2.0e-4
    high: 1.5e-3
    log: true

  - path: params.config.kl_threshold
    type: float
    low: 1.0e-3
    high: 3.0e-2
    log: true

  # Entropy floor raised: the one run collapsed (entropy/sigma down, actions saturating),
  # so bias exploration upward rather than letting it die.
  - path: params.config.entropy_coef
    type: float
    low: 1.0e-3
    high: 5.0e-2
    log: true

  - path: params.config.e_clip
    type: float
    low: 0.1
    high: 0.3

  # Critic ceiling raised: c_loss roughly tripled over the run (value chasing the
  # resampling moving target) — let the search give the critic more weight.
  - path: params.config.critic_coef
    type: float
    low: 1.0
    high: 5.0

  - path: params.config.grad_norm
    type: float
    low: 0.5
    high: 2.0

  # New knob: penalize action saturation (mu pushed past the bounds), which spiked
  # late in the run. 0.0 keeps it off.
  - path: params.config.bounds_loss_coef
    type: categorical
    choices: [0.0, 1.0e-4, 5.0e-4, 1.0e-3, 5.0e-3]

  - path: params.config.mini_epochs
    type: categorical
    choices: [2, 3, 4]

  # Full-ant-specific: episodes between morphology resamples. Larger = the critic
  # gets more time to settle per body set (c_loss), fewer 14.4s rebuild stalls.
  - path: params.config.resample_interval
    type: categorical
    choices: [2, 3, 5, 8]

  # ── transformer ── (d_model choices all divisible by every n_heads)
  - path: params.network.transformer.d_model
    type: categorical
    choices: [160, 208, 256]

  - path: params.network.transformer.n_heads
    type: categorical
    choices: [4, 8, 16]

  - path: params.network.transformer.n_layers
    type: categorical
    choices: [1, 2, 3]

derived_params:
  - path: params.network.transformer.ffn
    expr: "4 * d_model"
