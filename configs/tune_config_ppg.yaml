# PPG hyperparameter sweep (Optuna TPE via scripts/tune.py). Phase 2: ppg machinery
# frozen at the search winner (base config), now tunes the 6 shared PPO/GAE loss knobs
# (e_clip, entropy_coef, bounds_loss_coef, grad_norm, gamma, tau). Objective:
# recovered-level reward (mean of morph_reward/mean over the last 50 epochs); see ADR-0009.
#
#   run:    python scripts/tune.py configs/tune_config_ppg.yaml
#   resume: same command (study.db); --reset to start over
#
# NOTE: PPG ignores learning_rate / kl_threshold / mini_epochs (uses ppg.policy_lr /
# ppg.value_lr; fixed LR, no adaptive scheduler; e_pi/e_v replace mini_epochs) -> those
# are deliberately NOT tuned here. Trial 0 auto-runs the base-config defaults as a baseline.
# Proxy is 500 epochs (~14 min) -> short-horizon signal; under-credits aux (n_pi/e_aux).
study:
  name: ppg_ant_tune
  n_trials: 150                 # pruning makes trials cheaper -> afford more for better TPE signal; cancel early ok (resumes from study.db)
  output_dir: logs/tune/ppg_ant_tune
  script: scripts/train_ant_ppg.py
  base_config: configs/ppo_ant_ppg_tune.yaml
  trial_timeout_seconds: 1800   # safety net; heavy e_pi/e_v/e_aux trials cap <500 ep -> scored on partial
  metric_key: "morph_reward/mean"
  experiment_name_path: params.config.full_experiment_name
  train_dir_path: params.config.train_dir
  summaries_subdir: summaries
  sampler_seed: 42              # reproducible TPE (single-seed tuning)

# Early pruning (ADR-0009). tune.py polls the live TB log, reports an EMA of morph_reward/mean
# per epoch, and MedianPruner kills sub-median trials. Valid only while resample timing is
# fixed across trials (common-mode dip) -> set enabled:false for any sweep that tunes
# resample_interval (the full-ant sweep), which then falls back to the max objective.
pruner:
  enabled: true
  type: median
  n_startup_trials: 4           # first 4 trials (incl. the defaults baseline) run full
  n_warmup_steps: 200           # no prune before epoch 200 (the single resample is ~epoch 313)
  interval_steps: 25            # MedianPruner self-gates pruning checks to every 25 epochs
  ema_alpha: 0.3                # half-life ~2 ep, window ~6 ep: damps noise, tracks collapse
  score_window: 50              # recovered-level objective = mean of last 50 epochs
  poll_seconds: 20              # TB re-read cadence (detection latency only)

# Phase 2 sweep: the ppg machinery is FROZEN at the search winner (see base config);
# this tunes the 6 shared PPO/GAE loss knobs. critic_coef/scale_value omitted (dead
# under Adam + adv/value normalization). Changed search space -> run with --reset.
params:
  - path: params.config.e_clip
    type: float
    low: 0.10
    high: 0.30

  - path: params.config.entropy_coef
    type: float
    low: 1.0e-3
    high: 2.0e-2
    log: true

  - path: params.config.bounds_loss_coef
    type: float
    low: 1.0e-4
    high: 5.0e-3
    log: true

  - path: params.config.grad_norm
    type: float
    low: 0.5
    high: 5.0
    log: true

  - path: params.config.gamma
    type: categorical
    choices: [0.95, 0.97, 0.98, 0.99, 0.995]

  - path: params.config.tau
    type: categorical
    choices: [0.90, 0.95, 0.97, 0.99]
