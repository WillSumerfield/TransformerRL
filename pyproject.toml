[project]
name = "transformerrl"
version = "0.1.0"
requires-python = "==3.11.14"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "matplotlib>=3.9",
    "moviepy>=2.2.1",
    "numpy>=2.4.4",
    "optuna>=3.0.0",
    "python-xlib>=0.33; sys_platform == 'linux'", # viewer mouse orbit only; X11-only by nature
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "scikit-learn>=1.4", # optuna's fANOVA importance evaluator (scripts/tune.py --report)
    "seaborn>=0.13.0",
    "setuptools<81",
    "rl_games>=1.6.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "vlearn",
    "codesigner",
    "opencv-python-headless>=4.10",
    "plotly>=7.0.0",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.9",
    "scipy>=1.14",
    "jupyter>=1.1",
]

[tool.uv.sources]
vlearn = { path = "../vlearn-main/vlearn-0.3.9-cp311-cp311-linux_x86_64.whl" }
codesigner = { path = "Packages/codesigner-1.0.0-py3-none-any.whl" }
