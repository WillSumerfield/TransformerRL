[project]
name = "transformerrl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "moviepy>=2.2.1",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "setuptools<81",
    "skrl>=2.0.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.9",
    "scipy>=1.14",
    "jupyter>=1.1",
]
